<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Portal - AL-HAQQ MODEL COLLEGE</title>
<style>
body{margin:0;font-family:Arial;text-align:center;background:#f5f5f5}
.header{background:#4B0082;color:white;padding:25px 15px}
.header img{width:110px;height:110px;border-radius:50%;border:4px solid gold;background:white}
.header h1{font-size:22px;margin:10px 0 0}
.header p{color:gold;margin:5px 0 0;font-weight:bold}
.box{background:white;margin:20px;padding:20px;border-radius:12px;text-align:left}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.btn{display:block;background:#4B0082;color:white;padding:15px;text-align:center;border-radius:8px;text-decoration:none;font-weight:bold;border:none;width:100%;font-size:16px}
.btn.gold{background:#FFD700;color:#4B0082;margin-top:10px}
a{color:#4B0082}
</style>
</head>
<body>
<div class="header">
<img src="IMG-20261106-WA0020.jpg">
<h1>AL-HAQQ MODEL COLLEGE</h1>
<p>STUDENT PORTAL</p>
</div>

<div class="box">
<h2>Login</h2>
<p>Enter your Student ID and Password</p>
<input placeholder="Student ID e.g. AHQ/001">
<input type="password" placeholder="Password">
<button class="btn" onclick="alert('Portal login coming soon. Contact school admin.')">LOGIN</button>
<a class="btn gold" href="index.html">← Back to Home</a>
</div>

<div class="box">
<h2>Check Result</h2>
<p>Enter your Student ID to check result.</p>
<input placeholder="Enter Student ID">
<button class="btn" onclick="alert('Result checking coming soon.')">CHECK RESULT</button>
</div>

<div class="box" style="text-align:center">
<p>Need help? Contact School Admin<br>📍 Lagos, Nigeria</p>
</div>
</body>
</html>
